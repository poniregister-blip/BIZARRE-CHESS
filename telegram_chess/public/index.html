<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHESS — THE WORLD</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#352044,#111018 65%);color:#eee4d0;font:16px system-ui;min-height:100vh}header{padding:24px 5%;border-bottom:1px solid #594765;letter-spacing:4px;color:#e7c46b}h1{font:italic 900 clamp(32px,6vw,65px) Georgia;margin:0;text-shadow:4px 4px #583366}main{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:24px}#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(78vw,600px);aspect-ratio:1;border:4px solid #b79651;box-shadow:0 0 40px #000} .sq{position:relative;border:0;border-radius:0;padding:0;display:grid;place-items:center;font-size:clamp(24px,7vw,64px);cursor:pointer;aspect-ratio:1;font-family:'Segoe UI Symbol',serif}.light{background:#d7c39b}.dark{background:#65506e}.white{color:#fff6db;text-shadow:0 2px 2px #000,-1px -1px #333,1px 1px #333}.black{color:#19131f;text-shadow:0 1px #d7b36b}.sel{box-shadow:inset 0 0 0 5px #f7c742}.target:after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:#e5b52a99;pointer-events:none}.coord{position:absolute;left:3px;top:2px;font:10px system-ui;color:#342a35}aside{width:310px;max-width:90vw}.panel{background:#211b2a;border:1px solid #5c4968;padding:18px;margin-bottom:14px}button{font:inherit;color:inherit;background:#382a46;border:1px solid #806795;padding:10px 15px;cursor:pointer;border-radius:5px}button:disabled{opacity:.4;cursor:default}#power{width:100%;font:bold italic 25px Georgia;background:#d5ae51;color:#211728;border:2px solid #ffe5a0;padding:18px}.meter{height:8px;background:#41334d;margin:8px 0 16px}.meter i{display:block;height:100%;background:#e3bd60;transition:width .3s}small{color:#b9a9c3}#effect{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:10;background:#201331aa}#effect.on{display:grid;animation:flash 1.8s both}#effect svg{height:55vh;filter:drop-shadow(0 0 25px #ffd45d);animation:appear 1.8s both}#effect strong{position:absolute;bottom:12%;font:italic 900 clamp(40px,10vw,110px) Georgia;color:#ffe19a;text-shadow:5px 5px #663b92}body.frozen #board{filter:saturate(.25);box-shadow:0 0 35px #e7bc50}body.frozen #board .sel{filter:saturate(3)}@keyframes flash{0%{background:#fff}20%{background:#42216dbb}85%{opacity:1}100%{opacity:0}}@keyframes appear{0%{transform:scale(.5);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(1.1)}}#log{max-height:150px;overflow:auto;font-size:13px;color:#cbbbd4}dialog{background:#211b2a;color:#fff;border:1px solid gold} 
main{display:grid;grid-template-columns:minmax(0,600px) minmax(0,310px);align-items:start;max-width:1010px;margin:auto;gap:24px;padding:24px;width:100%}
#board{width:100%;min-width:0;aspect-ratio:1;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));overflow:hidden;align-self:start}
#board .sq{width:100%;height:100%;min-width:0;min-height:0;aspect-ratio:auto;overflow:hidden;margin:0;padding:0;border:0;border-radius:0;opacity:1;display:grid;place-items:center;text-shadow:none}

main[hidden]{display:none} #games button{display:block;margin:6px 0;width:100%} </style><header><small>STAND BATTLE / 01</small><h1>CHESS: THE WORLD</h1></header><section id="lobby" style="padding:16px;max-width:650px;margin:auto"><div id="stats"></div><button onclick="createGame('classic')">Классика</button> <button onclick="createGame('world')">THE WORLD</button><div id="games"></div><p id="message"></p></section><main hidden><div id="board"></div><aside><div class="panel"><small>ТЕКУЩИЙ ХОД</small><h2 id="status"></h2><div id="charges"></div><button id="power">THE WORLD</button><p id="hint"></p></div><div class="panel"><button id="restart">Реванш</button> <button id="invite">Пригласить</button> <button id="resign">Сдаться</button> <button id="sound">Звук: вкл</button><p><small>После 5 обычных ходов своей стороны король может остановить время и сделать 3 безопасных хода подряд вместо обычного хода. Если продолжение невозможно, время возобновляется.</small></p></div><div class="panel"><small>ИСТОРИЯ</small><div id="log"></div></div></aside></main><div id="effect"><svg viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg"><g stroke="#33213e" stroke-width="4" fill="#cda34a"><path d="M83 108 L49 123 18 192 38 213 72 161 65 245 87 306 116 306 120 235 130 306 159 306 177 245 168 161 202 213 222 192 191 123 157 108Z"/><path fill="#e7c66b" d="M83 25 120 5 157 25 165 66 149 106 120 119 91 106 75 66Z"/><path fill="#f7db8b" d="M83 112 120 130 157 112 169 153 148 186 92 186 71 153Z"/><path fill="#72523b" d="M93 194 147 194 158 223 120 245 82 223Z"/><path fill="#20182b" d="M87 58 114 65 107 76 88 71Z M153 58 126 65 133 76 152 71Z"/><path fill="#9b7637" d="M120 35 130 81 110 81Z"/><path fill="#e7c66b" d="M103 91 137 91 128 105 112 105Z"/></g></svg><strong>ZA WARUDO!</strong></div><dialog id="promotion"><p>Превращение пешки</p><div id="choices"></div></dialog><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const $=id=>document.getElementById(id), glyph={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}, dirs={n:[-33,-31,-18,-14,14,18,31,33],b:[-17,-15,15,17],r:[-16,-1,1,16],k:[-17,-16,-15,-1,1,15,16,17]},on=i=>i>=0&&i<128&&!(i&136),side=p=>!p||p==='.'?0:p===p.toUpperCase()?1:-1,sq=i=>'abcdefgh'[i&7]+(8-(i>>4));dirs.q=dirs.k;let g,charge,remaining,selected,ended,muted=false,history,locked=false;
const shapes={"p": "<circle cx=\"24\" cy=\"13\" r=\"7\"/><path d=\"M20 20h8l3 14 6 4v4H11v-4l6-4z\"/>", "r": "<path d=\"M10 7h7v7h4V7h6v7h4V7h7v13l-5 4v11l5 4v3H10v-3l5-4V24l-5-4z\"/>", "n": "<path d=\"M10 42v-5c0-8 7-13 13-18l-9 5-6-5L20 7l2-4 5 6c10 3 13 12 10 26l1 3v4z\"/><circle cx=\"22\" cy=\"14\" r=\"1.5\" fill=\"#a78b61\" stroke=\"none\"/>", "b": "<path d=\"M24 5c-5 6-11 11-11 17 0 5 4 8 8 9l-3 5-7 3v3h26v-3l-7-3-3-5c5-1 8-4 8-9 0-6-6-11-11-17z\"/><path d=\"m28 11-8 10\" fill=\"none\" stroke=\"#a78b61\" stroke-width=\"2.5\"/>", "q": "<path d=\"m7 13 9 8 8-12 8 12 9-8-7 22 5 4v3H9v-3l5-4z\"/><circle cx=\"7\" cy=\"10\" r=\"3\"/><circle cx=\"24\" cy=\"6\" r=\"3\"/><circle cx=\"41\" cy=\"10\" r=\"3\"/>", "k": "<path d=\"M21 3h6v6h7v6h-7v5c8-6 16 0 13 8l-7 8 5 3v3H10v-3l5-3-7-8c-3-8 5-14 13-8v-5h-7V9h7z\"/>"}; function pieceSVG(p){return shapes[p.toLowerCase()]?`<svg class="piece" viewBox="0 0 48 48" aria-hidden="true">${shapes[p.toLowerCase()]}</svg>`:"";}
function name(t){return t===1?'Белые':'Чёрные'}function canPower(){return powerReady}function render(){let moves=allowed;$('status').textContent=ended||name(g.t)+(remaining?' · остановка времени':inCheck?' · шах':'');$('charges').innerHTML=[1,-1].map(t=>`${name(t)} — ${charge[t]}/5<div class="meter"><i style="width:${charge[t]*20}%"></i></div>`).join('');$('power').disabled=!canPower()||locked;$('power').hidden=mode==='classic';$('charges').hidden=mode==='classic';$('hint').hidden=mode==='classic';$('hint').textContent=remaining?'Ходов короля осталось: '+remaining:canPower()?'Стенд готов к активации!':'Перезарядка стенда';document.body.classList.toggle('frozen',!!remaining);$('board').replaceChildren();for(let j=0;j<64;j++){let k=mySide===-1?63-j:j,i=(k>>3)*16+(k&7),p=g.b[i],el=document.createElement('button');el.className='sq '+(((j>>3)+(j&7))%2?'dark':'light')+' '+(side(p)===1?'white':'black')+(selected===i?' sel':'')+(moves.some(m=>m[0]===selected&&m[1]===i)?' target':'');el.innerHTML=pieceSVG(p);el.setAttribute('aria-label',sq(i));if((i&7)===0||(i>>4)===7){let c=document.createElement('span');c.className='coord';c.textContent=sq(i);el.append(c)}el.onclick=()=>click(i);$('board').append(el)}$('log').textContent=history.slice().reverse().join('\n');$('log').style.whiteSpace='pre-line'}
function click(i){if(ended||locked||mySide!==g.t)return;let moves=allowed;if(side(g.b[i])===g.t){selected=selected===i?-1:i;render();return}let options=moves.filter(m=>m[0]===selected&&m[1]===i);if(options.length===1)play(options[0]);else if(options.length>1){$('choices').replaceChildren();for(let m of options){let b=document.createElement('button');b.innerHTML=pieceSVG(m[2]);b.onclick=()=>{$('promotion').close();play(m)};$('choices').append(b)}$('promotion').showModal()}}
let audio;function tone(start){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let now=audio.currentTime;for(let i=0;i<4;i++){let o=audio.createOscillator(),a=audio.createGain();o.type=i===0?'sawtooth':'sine';o.frequency.setValueAtTime((start?180:65)*(i+1),now);o.frequency.exponentialRampToValueAtTime((start?30:160)*(i+1),now+.8);a.gain.setValueAtTime(.0001,now);a.gain.exponentialRampToValueAtTime(.06,now+.04);a.gain.exponentialRampToValueAtTime(.0001,now+1);o.connect(a).connect(audio.destination);o.start(now);o.stop(now+1)}}catch(e){}}

const tg=window.Telegram.WebApp;tg.ready();tg.expand();let id=null,rev=-1,allowed=[],mySide=0,mode='',powerReady=false,inCheck=false,current=null;const message=t=>$('message').textContent=t;async function api(action,data={}){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,action,...data})});let x=await r.json();if(!r.ok)throw Error(x.error);return x}async function lobby(){let x=await api('list');$('stats').textContent=`Победы: ${x.wins} · Поражения: ${x.losses} · Ничьи: ${x.draws}`;$('games').replaceChildren();for(let a of x.games){let b=document.createElement('button');b.textContent=a.mode+' · '+a.id.slice(0,6)+' · '+(a.result===null?'В процессе':'Завершена');b.onclick=()=>openGame(a.id);$('games').append(b)}}async function openGame(i){id=i;rev=-1;await refresh()}async function createGame(mode){try{let x=await api('create',{mode});await openGame(x.id);invite()}catch(e){message(e.message)}}function show(x){if(x.rev===rev)return;let old=remaining;current=x;rev=x.rev;g=x.g;charge=x.charge;remaining=x.remaining;history=x.history;ended=x.ended;allowed=x.allowed;mySide=x.mySide;mode=x.mode;powerReady=x.powerReady;inCheck=x.inCheck;selected=-1;if($('promotion').open)$('promotion').close();document.querySelector('main').hidden=false;render();$('status').textContent=x.waiting?'Ожидание друга':ended|| (g.t===mySide?'Ваш ход':'Ход друга')+(remaining?' · THE WORLD':'')+(inCheck?' · шах':'');if(remaining===3&&old!==3){tone(true);$('effect').classList.add('on');setTimeout(()=>$('effect').classList.remove('on'),1800)}else if(old>0&&!remaining)tone(false);$('restart').disabled=!ended;$('resign').disabled=!!ended||x.waiting}async function refresh(){if(id)show(await api('state',{id}))}async function act(action,data={}){if(locked)return;locked=true;try{show(await api(action,{id,rev,...data}))}catch(e){message(e.message);await refresh().catch(()=>{})}finally{locked=false;if(g)render();if(current)$('status').textContent=current.waiting?'Ожидание друга':ended|| (g.t===mySide?'Ваш ход':'Ход друга')+(remaining?' · THE WORLD':'')}}function play(m){act('move',{move:m})}function invite(){if(current)tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(current.link)+'&text='+encodeURIComponent('Сыграем в шахматы?'))}$('invite').onclick=invite;$('power').onclick=()=>act('power');$('resign').onclick=()=>{if(confirm('Сдаться?'))act('resign')};$('restart').onclick=async()=>{try{let x=await api('rematch',{id});await openGame(x.id);await lobby()}catch(e){message(e.message)}};$('sound').onclick=()=>{muted=!muted;$('sound').textContent='Звук: '+(muted?'выкл':'вкл');if(!muted)tone(false)};async function init(){try{if(!tg.initData)throw Error('Откройте игру через Telegram');if(tg.initDataUnsafe.start_param)await openGame(tg.initDataUnsafe.start_param);await lobby();setInterval(()=>{if(!locked)refresh().catch(e=>message(e.message));},1500);setInterval(()=>lobby().catch(()=>{}),10000)}catch(e){message(e.message)}}init();</script></html>
